<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled Math Sprint</title>
  <link rel="stylesheet" href="./Untitled%20Math%20Sprint.css">
  <link rel="stylesheet" href="../shared.css">
</head>
<body>

  <header class="topbar">
    <a class="back" href="../index.html">← All games</a>
    <h1>Untitled Math Sprint</h1>
    <button class="btn" id="startBtn" type="button">Start round</button>
  </header>

  <div class="completed-badge" id="completedBadge" hidden>
    🏆 100% Completed — every achievement unlocked
  </div>

  <section class="hud" aria-label="Game stats">
    <div class="stat">
      <span class="label">Score</span>
      <strong id="score">0</strong>
    </div>
    <div class="stat">
      <span class="label">Best</span>
      <strong id="best">0</strong>
    </div>
    <div class="stat">
      <span class="label">Streak</span>
      <strong id="streak">0</strong>
    </div>
    <div class="stat">
      <span class="label">Time</span>
      <strong id="time">60s</strong>
    </div>
  </section>

  <section class="chips" aria-label="Mode">
    <button class="chip is-active" type="button" data-variant="classic">Classic · 60s</button>
    <button class="chip" type="button" data-variant="blitz">Blitz · 30s</button>
    <button class="chip" type="button" data-variant="marathon">Marathon · 120s</button>
    <button class="chip" type="button" data-variant="multiply">Multiply</button>
    <button class="chip" type="button" data-variant="addsub">Add / Sub</button>
  </section>

  <main class="game">
    <div class="problem" id="problem" aria-live="polite">Press start</div>

    <form class="answer-row" id="answerForm">
      <input class="answer" id="answer" type="text" inputmode="numeric" autocomplete="off"
             placeholder="?" aria-label="Your answer" disabled>
      <button class="btn" type="submit">Enter</button>
    </form>

    <p class="hint">Answer as many as you can before the clock runs out. Enter submits.</p>
  </main>

  <section class="achievements" aria-label="Achievements">
    <h2>Achievements</h2>
    <div class="achievement-list" id="achievementList"></div>
  </section>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
      <h2 id="overlayTitle"></h2>
      <p id="overlaySummary"></p>
      <div class="overlay-actions">
        <button class="btn" id="primaryBtn" type="button"></button>
        <button class="btn btn--ghost" id="secondaryBtn" type="button">All games</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../shared.js"></script>
  <script src="./Untitled%20Math%20Sprint.js"></script>
</body>
</html>
