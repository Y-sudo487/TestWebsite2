<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled Memory Match</title>
  <link rel="stylesheet" href="./Untitled%20Memory%20Match.css">
  <link rel="stylesheet" href="../shared.css">
</head>
<body>

  <header class="topbar">
    <a class="back" href="../index.html">← All games</a>
    <h1>Untitled Memory Match</h1>
    <button class="btn" id="restartBtn" type="button">New Game</button>
  </header>

  <div class="completed-badge" id="completedBadge" hidden>
    🏆 100% Completed — every achievement unlocked
  </div>

  <section class="hud" aria-label="Game stats">
    <div class="stat">
      <span class="label">Moves</span>
      <strong id="moves">0</strong>
    </div>
    <div class="stat">
      <span class="label">Pairs</span>
      <strong id="pairs">0 / 8</strong>
    </div>
    <div class="stat">
      <span class="label">Time</span>
      <strong id="timer">0:00</strong>
    </div>
    <div class="stat">
      <span class="label">Best</span>
      <strong id="best">—</strong>
    </div>
  </section>

  <section class="chips" aria-label="Board size">
    <button class="chip is-active" type="button" data-variant="4x4">4 × 4</button>
    <button class="chip" type="button" data-variant="5x4">5 × 4</button>
    <button class="chip" type="button" data-variant="6x6">6 × 6</button>
  </section>

  <main class="board" id="board" aria-label="Memory match board"></main>

  <section class="achievements" aria-label="Achievements">
    <h2>Achievements</h2>
    <div class="achievement-list" id="achievementList"></div>
  </section>

  <div class="win" id="win" hidden>
    <div class="win-panel" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <h2 id="winTitle">You matched them all!</h2>
      <p id="winSummary"></p>
      <div class="win-actions">
        <button class="btn" id="playAgainBtn" type="button">Play again</button>
        <a class="btn btn--ghost" href="../index.html">All games</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../shared.js"></script>
  <script src="./Untitled%20Memory%20Match.js"></script>
</body>
</html>
