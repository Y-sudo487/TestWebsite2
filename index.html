<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y-Sudo's Untitled Games</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a class="navbar-brand" href="index.html">
        Y-Sudo's Untitled Games
      </a>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <span class="badge">Made for learning purposes</span>

      <h1>Welcome to <span class="accent">Y-Sudo's Untitled Games</span></h1>
    </section>

    <section class="features" aria-label="Features">
      <article class="card">
        <h2>
          Untitled Memory Match
          <span class="finish-badge" data-completed-badge="memory" hidden title="100% achievements unlocked">🏆 100%</span>
        </h2>
        <a class="card-link" href="Untitled%20Memory%20Match/Untitled%20Memory%20Match.html">Open the game <span aria-hidden="true">→</span></a>
      </article>

      <article class="card">
        <h2>
          Untitled Number Merge
          <span class="finish-badge" data-completed-badge="merge" hidden title="100% achievements unlocked">🏆 100%</span>
        </h2>
        <a class="card-link" href="Untitled%20Number%20Merge/Untitled%20Number%20Merge.html">Open the game <span aria-hidden="true">→</span></a>
      </article>

      <article class="card">
        <h2>
          Untitled Sudoku
          <span class="finish-badge" data-completed-badge="sudoku" hidden title="100% achievements unlocked">🏆 100%</span>
        </h2>
        <a class="card-link" href="Untitled%20Sudoku/Untitled%20Sudoku.html">Open the game <span aria-hidden="true">→</span></a>
      </article>


    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-line">
        <span>© 2026 Y-Sudo's Untitled Games</span>
        <span aria-hidden="true">•</span>
        <span>Made with love for demo purposes</span>
      </p>
    </div>
  </footer>

  <script src="./home.js"></script>
</body>
</html>
