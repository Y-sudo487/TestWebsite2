<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled Tic-Tac-Toe</title>
  <link rel="stylesheet" href="./Untitled%20Tic-Tac-Toe.css">
  <link rel="stylesheet" href="../shared.css">
</head>
<body>

  <header class="topbar">
    <a class="back" href="../index.html">← All games</a>
    <h1>Untitled Tic-Tac-Toe</h1>
    <button class="btn" id="restartBtn" type="button">New Game</button>
  </header>

  <div class="completed-badge" id="completedBadge" hidden>
    🏆 100% Completed — every achievement unlocked
  </div>

  <section class="hud" aria-label="Game stats">
    <div class="stat">
      <span class="label">Wins</span>
      <strong id="wins">0</strong>
    </div>
    <div class="stat">
      <span class="label">Draws</span>
      <strong id="draws">0</strong>
    </div>
    <div class="stat">
      <span class="label">Streak</span>
      <strong id="streak">0</strong>
    </div>
    <div class="stat">
      <span class="label">Best</span>
      <strong id="best">0</strong>
    </div>
  </section>

  <section class="chips" aria-label="Game mode">
    <button class="chip is-active" type="button" data-mode="ai">vs Computer</button>
    <button class="chip" type="button" data-mode="two">2 Players</button>
  </section>

  <p class="status" id="status" role="status" aria-live="polite">Your turn — you are X</p>

  <main class="board" id="board" aria-label="Tic-Tac-Toe board"></main>

  <section class="achievements" aria-label="Achievements">
    <h2>Achievements</h2>
    <div class="achievement-list" id="achievementList"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../shared.js"></script>
  <script src="./Untitled%20Tic-Tac-Toe.js"></script>
</body>
</html>
